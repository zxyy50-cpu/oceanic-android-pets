name: Build Luka Umi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and unzip project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 找不到 ZIP 專案檔"
            echo "目前 repo 根目錄內容："
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "✅ 找到 ZIP：$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ ZIP 裡找不到 settings.gradle.kts"
            echo "解壓後的檔案："
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "✅ Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "📁 Build directory:"
          pwd
          ls -la

          gradle :app:assembleDebug --stacktrace

          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "❌ Build 完成但找不到 APK"
            find app/build -type f | tail -n 100
            exit 1
          fi

          echo "✅ APK found: $APK_FILE"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/Luka-Umi-V3.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luka-Umi-V3.1-APK
          path: Luka-Umi-V3.1.apk
          if-no-files-found: error
